name = "cmp"
mode = "binary"

# Safe, credential-free deployment manifest. Build the target binary before
# deploying and keep environment-specific secrets outside this file.

[binary]
path = "./target/x86_64-unknown-linux-gnu/release/server"
runtime = "debian"

[service]
internal_port = 3000
always_on = true

[resources]
vcpu = 1
memory_mb = 256
